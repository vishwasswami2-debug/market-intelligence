<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Intelligence Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 15px;
    }

    .status {
      padding: 12px;
      background: white;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .nifty {
      font-size: 32px;
      font-weight: bold;
    }

    .change {
      font-size: 18px;
      margin-top: 8px;
    }

    .stock {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .stock:last-child {
      border-bottom: none;
    }

    .symbol {
      font-weight: bold;
      font-size: 18px;
    }

    .positive {
      color: green;
    }

    .negative {
      color: red;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>📊 Market Intelligence</h1>
  <p>NSE/BSE Market Monitoring Dashboard</p>
</header>

<div class="container">

  <div class="status">
    <strong>Backend Status:</strong>
    <span id="status">Connecting...</span>
  </div>

  <div class="card">
    <h2>NIFTY 50</h2>
    <div class="nifty" id="niftyValue">Loading...</div>
    <div class="change" id="niftyChange"></div>
  </div>

  <div class="card">
    <h2>Stocks</h2>
    <div id="stocks">
      Loading market data...
    </div>
  </div>

  <div class="card">
    <button onclick="loadMarketData()">🔄 Refresh Data</button>
    <p id="time"></p>
  </div>

</div>

<script>

  // YOUR RENDER BACKEND
  const API_URL = "https://market-intelligence-api-5ajk.onrender.com";

  async function loadMarketData() {

    const status = document.getElementById("status");
    const niftyValue = document.getElementById("niftyValue");
    const niftyChange = document.getElementById("niftyChange");
    const stocksDiv = document.getElementById("stocks");
    const time = document.getElementById("time");

    status.textContent = "Connecting...";

    try {

      const response = await fetch(API_URL);

      if (!response.ok) {
        throw new Error("Server error: " + response.status);
      }

      const data = await response.json();

      status.textContent = "Connected ✅";

      // NIFTY
      if (data.nifty) {

        niftyValue.textContent =
          Number(data.nifty.value).toLocaleString("en-IN");

        const change =
          Number(data.nifty.change || 0);

        const percent =
          Number(data.nifty.change_percent || 0);

        niftyChange.textContent =
          `${change >= 0 ? "+" : ""}${change} (${percent >= 0 ? "+" : ""}${percent}%)`;

        niftyChange.className =
          "change " + (change >= 0 ? "positive" : "negative");
      }

      // STOCKS
      stocksDiv.innerHTML = "";

      if (data.stocks && data.stocks.length > 0) {

        data.stocks.forEach(stock => {

          const change = Number(stock.change || 0);
          const percent = Number(stock.change_percent || 0);

          const div = document.createElement("div");

          div.className = "stock";

          div.innerHTML = `
            <div>
              <div class="symbol">${stock.symbol}</div>
              <div>${stock.name || ""}</div>
            </div>

            <div style="text-align:right">
              <strong>${Number(stock.price).toLocaleString("en-IN")}</strong>
              <div class="${change >= 0 ? "positive" : "negative"}">
                ${change >= 0 ? "+" : ""}${change}
                (${percent >= 0 ? "+" : ""}${percent}%)
              </div>
            </div>
          `;

          stocksDiv.appendChild(div);
        });

      } else {

        stocksDiv.textContent = "No stock data available.";

      }

      // TIME
      time.textContent =
        "Last update: " +
        (data.timestamp || new Date().toLocaleString());

    }

    catch (error) {

      status.textContent = "Connection failed ❌";

      stocksDiv.innerHTML =
        "<p>Unable to load market data.</p>";

      console.error(error);
    }
  }

  // Load automatically
  loadMarketData();

  // Refresh every 30 seconds
  setInterval(loadMarketData, 30000);

</script>

</body>
</html>
